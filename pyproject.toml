[project]
name = "ai-safety-os"
version = "0.1.0"
description = "Appropriateness infrastructure for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Alexandros Kalyvas" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# The contextual LLM assessor. Use a current SDK: structured outputs
# (output_config.format) and adaptive thinking are recent additions.
llm = [
  "anthropic>=0.69",
]

# The installed library surface is the runtime package and the adapters. The benchmark,
# examples, labeling, and web folders are run from the repo root (python -m ...), not
# shipped, so they are excluded from package discovery.
[tool.setuptools]
packages = ["ai_safety_os", "ai_safety_os.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
