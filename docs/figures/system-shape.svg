<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="title desc">
  <title id="title">AI Safety OS system shape</title>
  <desc id="desc">Agent tool proposals and context flow into MoralAgentOS assess, through a thin safety floor, contextual assessment, interdependence signals, and then one of five moral decisions.</desc>
  <rect width="980" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f4654"/>
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #9aa7b7; stroke-width: 1.5; rx: 8; }
      .core { fill: #eef7f1; stroke: #6a8f4f; stroke-width: 1.7; rx: 8; }
      .decision { fill: #fff7e8; stroke: #d49a38; stroke-width: 1.5; rx: 8; }
      .terminal { fill: #f8f6ff; stroke: #8d79b8; stroke-width: 1.4; rx: 8; }
      .label { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1f2937; text-anchor: middle; }
      .small { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 12px; fill: #526071; text-anchor: middle; }
      .line { fill: none; stroke: #3f4654; stroke-width: 1.7; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #8995a5; stroke-width: 1.3; marker-end: url(#arrow); stroke-dasharray: 5 4; }
    </style>
  </defs>

  <text x="56" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">System Shape</text>
  <text x="56" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">A thin floor plus contextual/interdependent judgment before tool execution.</text>

  <rect class="box" x="56" y="118" width="190" height="74"/>
  <text class="label" x="151" y="148">Agent tool call</text>
  <text class="small" x="151" y="170">proposed action</text>

  <rect class="box" x="56" y="238" width="190" height="86"/>
  <text class="label" x="151" y="268">ContextSnapshot</text>
  <text class="small" x="151" y="290">role, stakes, stakeholders,</text>
  <text class="small" x="151" y="307">dependency, repair, norms</text>

  <rect class="core" x="310" y="174" width="188" height="90"/>
  <text class="label" x="404" y="207">MoralAgentOS</text>
  <text class="small" x="404" y="229">assess(action, context)</text>

  <rect class="core" x="560" y="92" width="180" height="68"/>
  <text class="label" x="650" y="121">Thin safety floor</text>
  <text class="small" x="650" y="142">legal, safety, irreversible</text>

  <rect class="core" x="560" y="190" width="180" height="78"/>
  <text class="label" x="650" y="221">Context model</text>
  <text class="small" x="650" y="243">stakes, authority, norms</text>

  <rect class="core" x="560" y="300" width="180" height="92"/>
  <text class="label" x="650" y="331">Interdependence</text>
  <text class="small" x="650" y="353">repair, public review,</text>
  <text class="small" x="650" y="370">shared intent, dependency</text>

  <rect class="decision" x="800" y="205" width="132" height="70"/>
  <text class="label" x="866" y="235">MoralDecision</text>
  <text class="small" x="866" y="256">route + rationale</text>

  <rect class="terminal" x="110" y="422" width="132" height="48"/>
  <text class="small" x="176" y="451">allow: execute</text>
  <rect class="terminal" x="268" y="422" width="132" height="48"/>
  <text class="small" x="334" y="451">confirm: ask user</text>
  <rect class="terminal" x="426" y="422" width="132" height="48"/>
  <text class="small" x="492" y="444">alternatives:</text>
  <text class="small" x="492" y="460">show readings</text>
  <rect class="terminal" x="584" y="422" width="132" height="48"/>
  <text class="small" x="650" y="451">escalate: review</text>
  <rect class="terminal" x="742" y="422" width="132" height="48"/>
  <text class="small" x="808" y="451">block: stop</text>

  <path class="line" d="M 246 155 L 310 205"/>
  <path class="line" d="M 246 281 L 310 235"/>
  <path class="line" d="M 498 219 L 560 126"/>
  <path class="line" d="M 498 219 L 560 229"/>
  <path class="line" d="M 498 219 L 560 346"/>
  <path class="line" d="M 740 126 C 775 126 781 223 800 223"/>
  <path class="line" d="M 740 229 L 800 238"/>
  <path class="line" d="M 740 346 C 775 346 781 258 800 258"/>

  <path class="soft" d="M 866 275 C 866 365 176 362 176 422"/>
  <path class="soft" d="M 866 275 C 866 366 334 366 334 422"/>
  <path class="soft" d="M 866 275 C 866 368 492 368 492 422"/>
  <path class="soft" d="M 866 275 C 866 370 650 370 650 422"/>
  <path class="soft" d="M 866 275 C 866 372 808 372 808 422"/>
</svg>
