name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scenarios
        run: python -m bench.validate
      - name: Run benchmark smoke test
        run: python -m bench.run
      - name: Run context-ablation smoke test
        run: python -m bench.ablation
      - name: Run frontier sweep smoke test
        run: python -m bench.sweep
      - name: Run failure analysis smoke test
        run: python -m bench.failure_analysis
      - name: Run interdependence benchmark smoke test
        run: python -m bench.interdependence
      - name: Generate report artifacts smoke test
        run: python -m bench.report
      - name: Run norm-memory frozen-control smoke test
        run: python -m bench.memory_demo
      - name: Run framework-adapters example smoke test
        run: python examples/framework_adapters.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check ai_safety_os adapters bench tests examples
