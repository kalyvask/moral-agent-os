name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scenarios
        run: python -m bench.validate
      - name: Run benchmark smoke test
        run: python -m bench.run
      - name: Run interdependence benchmark smoke test
        run: python -m bench.interdependence
      - name: Generate interdependence report smoke test
        run: python -m bench.report_interdependence --output bench/report/interdependence.md
      - name: Run unit tests
        run: python -m unittest discover -s tests
